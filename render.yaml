services:
  - type: web
    name: settle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: MERCHANT_EMAIL
        sync: false
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
      - key: LLM_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/settle.db
